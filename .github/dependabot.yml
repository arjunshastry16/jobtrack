# Weekly PRs to bump pinned GitHub Actions, Go modules, the frontend's npm packages and
# the Dockerfile's base images.
#
# Every ecosystem has a 14-day cooldown: only releases that have been out for two weeks
# are proposed, so a compromised or broken release is likely caught (and pulled) before
# it reaches this repo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]

  # The Dockerfile's base images (pinned by digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      docker:
        patterns: ["*"]
