name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a moved or
      # compromised tag can't change what runs. Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # keep in step with the local install

  generated:
    name: Generated code up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same pinned sqlc image as `make generate`. Fails if someone edited SQL
      # (or generated Go) without regenerating.
      - name: Regenerate with sqlc
        run: make generate
      - name: Fail on drift
        run: git diff --exit-code -- internal/store

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Exactly the locked versions; install scripts are off (web/.npmrc).
      - name: Install
        run: npm ci
      # The frontend's API types are generated from docs/openapi.yaml. Fails if the spec
      # changed without regenerating, so the UI can't silently drift from the API.
      - name: API types up to date
        run: npm run generate && git diff --exit-code -- src/api/schema.d.ts
      - name: Type-check and build
        run: npm run build
      # The build lands in internal/webui/dist; check the Go binary embeds it and that
      # it fits the Content-Security-Policy (no inline scripts or styles).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build the binary with the UI embedded
        working-directory: .
        run: go build -tags webui -o /dev/null ./cmd/api
      - name: Test the embedded build
        working-directory: .
        run: go test -tags webui ./internal/webui/

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Throwaway Postgres for integration tests (same version as dev/prod). Each test
    # creates and drops its own database on it.
    services:
      postgres:
        image: postgres:18.7-alpine3.24
        env:
          POSTGRES_USER: jobtrack
          POSTGRES_PASSWORD: jobtrack # CI-only throwaway container
          POSTGRES_DB: jobtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JOBTRACK_TEST_DATABASE_URL: postgres://jobtrack:jobtrack@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Check go.mod / go.sum are tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      # Runs with the race detector, which can't run on the Pi 5 itself (47-bit VMA).
      - name: Test (race detector + coverage)
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          {
            echo '### Test coverage'
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
