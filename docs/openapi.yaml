openapi: 3.0.3
info:
  title: jobtrack API
  version: 0.1.0
  description: |
    Self-hosted job-search tracker. All request and response bodies are JSON.

    Every error has the same shape (`Error`): a stable machine-readable `code`, a
    human-readable `message`, and for validation errors a `fields` map.

    This file is checked by tests: it must be valid OpenAPI, list exactly the routes the
    server registers, and every response produced by the integration tests must match it.
  license:
    name: MIT

tags:
  - name: health
  - name: companies
  - name: applications
  - name: contacts
  - name: notes
  - name: watches

paths:
  /healthz:
    get:
      tags: [health]
      summary: "Liveness: the process is up"
      operationId: healthz
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /readyz:
    get:
      tags: [health]
      summary: "Readiness: the database is reachable"
      operationId: readyz
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: Not ready (database unreachable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }

  /api/v1/openapi.yaml:
    get:
      tags: [health]
      summary: This specification
      operationId: getOpenAPISpec
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/yaml:
              schema: { type: string }

  /api/v1/companies:
    get:
      tags: [companies]
      summary: List companies (sorted by name, case-insensitive; at most 500)
      operationId: listCompanies
      responses:
        "200":
          description: Companies
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [companies]
                properties:
                  companies:
                    type: array
                    items: { $ref: "#/components/schemas/Company" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [companies]
      summary: Create a company
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInput" }
      responses:
        "201":
          description: Created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/companies/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [companies]
      summary: Get a company
      operationId: getCompany
      responses:
        "200":
          description: The company
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [companies]
      summary: Replace a company's fields (an omitted website is cleared)
      operationId: updateCompany
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [companies]
      summary: Delete a company (refused while it has applications or contacts)
      operationId: deleteCompany
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/applications:
    get:
      tags: [applications]
      summary: List applications, newest first, one page at a time
      description: |
        Keyset pagination: pass the previous page's `next_cursor` as `cursor` to get the
        next page. `next_cursor` is null on the last page. Cursors are opaque.
      operationId: listApplications
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/Status" }
        - name: company_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of applications
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [applications, next_cursor]
                properties:
                  applications:
                    type: array
                    items: { $ref: "#/components/schemas/Application" }
                  next_cursor:
                    type: string
                    nullable: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [applications]
      summary: Create an application (also records its first timeline event)
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationCreate" }
      responses:
        "201":
          description: Created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/applications/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [applications]
      summary: Get an application
      operationId: getApplication
      responses:
        "200":
          description: The application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [applications]
      summary: Replace an application's editable fields
      description: Status cannot be changed here; use the transitions endpoint.
      operationId: updateApplication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationFields" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [applications]
      summary: Delete an application with its timeline, notes and contact links
      operationId: deleteApplication
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/applications/{id}/transitions:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [applications]
      summary: Move an application to a new stage
      description: |
        Only moves allowed by the pipeline are accepted (see `next_statuses` on the
        application). The status change and its timeline event are saved atomically.
      operationId: transitionApplication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionInput" }
      responses:
        "201":
          description: Moved; returns the updated application and the new event
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [application, event]
                properties:
                  application: { $ref: "#/components/schemas/Application" }
                  event: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/applications/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [applications]
      summary: An application's stage history, oldest first
      operationId: getApplicationTimeline
      responses:
        "200":
          description: The timeline
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [application_id, status, events]
                properties:
                  application_id: { type: integer, format: int64 }
                  status: { $ref: "#/components/schemas/Status" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/applications/{id}/contacts:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [contacts]
      summary: Contacts linked to an application
      operationId: listApplicationContacts
      responses:
        "200":
          description: Linked contacts, sorted by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/applications/{id}/contacts/{contact_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/ContactId"
    put:
      tags: [contacts]
      summary: Link a contact to an application (idempotent)
      operationId: linkContact
      responses:
        "204": { description: Linked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [contacts]
      summary: Unlink a contact from an application
      operationId: unlinkContact
      responses:
        "204": { description: Unlinked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/applications/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [notes]
      summary: An application's notes, oldest first
      operationId: listNotes
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [notes]
                properties:
                  notes:
                    type: array
                    items: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [notes]
      summary: Add a note to an application
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/contacts:
    get:
      tags: [contacts]
      summary: List contacts (sorted by name; at most 500)
      operationId: listContacts
      parameters:
        - name: company_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [contacts]
      summary: Create a contact
      operationId: createContact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201":
          description: Created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/contacts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [contacts]
      summary: Get a contact
      operationId: getContact
      responses:
        "200":
          description: The contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [contacts]
      summary: Replace a contact's fields
      operationId: updateContact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [contacts]
      summary: Delete a contact (its application links go too)
      operationId: deleteContact
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [notes]
      summary: Replace a note's text
      operationId: updateNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [notes]
      summary: Delete a note
      operationId: deleteNote
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/watches:
    get:
      tags: [watches]
      summary: List job-board watches
      operationId: listWatches
      responses:
        "200":
          description: Watches
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [watches]
                properties:
                  watches:
                    type: array
                    items: { $ref: "#/components/schemas/Watch" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [watches]
      summary: Watch a company's job board for postings matching keywords
      operationId: createWatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchInput" }
      responses:
        "201":
          description: Created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/watches/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [watches]
      summary: Get a watch
      operationId: getWatch
      responses:
        "200":
          description: The watch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [watches]
      summary: Replace a watch's settings
      operationId: updateWatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [watches]
      summary: Stop watching a board
      operationId: deleteWatch
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ContactId:
      name: contact_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  headers:
    Location:
      description: URL of the created resource
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed JSON, bad path id, or bad query parameters
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The resource (or a resource it refers to) does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with existing data (duplicate name, dependent rows, invalid stage move)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Request body over 1 MiB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: Well-formed JSON with invalid values; see `fields`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: Unexpected server error (details are logged, not returned)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_json, body_too_large, validation_failed, invalid_id, invalid_query,
                     not_found, conflict, invalid_transition, internal]
            message: { type: string }
            fields:
              type: object
              description: Field name -> problem, for validation_failed and invalid_query
              additionalProperties: { type: string }

    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    Ready:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status: { type: string, enum: [ready, unavailable] }
        database: { type: string, enum: [ok, unreachable] }

    Status:
      type: string
      enum: [wishlist, applied, screening, interviewing, offer, accepted, rejected, withdrawn]

    Company:
      type: object
      additionalProperties: false
      required: [id, name, website, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        website: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CompanyInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        website: { type: string, nullable: true, description: "http(s) URL" }

    Application:
      type: object
      additionalProperties: false
      required: [id, company_id, company_name, role, job_url, source, location, salary_min,
                 salary_max, salary_currency, status, next_statuses, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        company_id: { type: integer, format: int64 }
        company_name: { type: string }
        role: { type: string }
        job_url: { type: string, nullable: true }
        source: { type: string, nullable: true }
        location: { type: string, nullable: true }
        salary_min: { type: integer, format: int32, nullable: true }
        salary_max: { type: integer, format: int32, nullable: true }
        salary_currency: { type: string, nullable: true, description: ISO 4217 code }
        status: { $ref: "#/components/schemas/Status" }
        next_statuses:
          type: array
          description: Stages this application may move to next
          items: { $ref: "#/components/schemas/Status" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApplicationFields:
      type: object
      additionalProperties: false
      required: [company_id, role]
      properties:
        company_id: { type: integer, format: int64, minimum: 1 }
        role: { type: string, minLength: 1, maxLength: 200 }
        job_url: { type: string, nullable: true, description: "http(s) URL" }
        source: { type: string, nullable: true, maxLength: 100 }
        location: { type: string, nullable: true, maxLength: 200 }
        salary_min: { type: integer, format: int32, nullable: true, minimum: 0, maximum: 100000000 }
        salary_max: { type: integer, format: int32, nullable: true, minimum: 0, maximum: 100000000 }
        salary_currency:
          type: string
          nullable: true
          description: ISO 4217 code (case-insensitive); required when a salary is given

    # Spelled out rather than allOf(ApplicationFields, ...): in OpenAPI 3.0,
    # additionalProperties: false on ApplicationFields would reject "status".
    ApplicationCreate:
      type: object
      additionalProperties: false
      required: [company_id, role]
      properties:
        company_id: { type: integer, format: int64, minimum: 1 }
        role: { type: string, minLength: 1, maxLength: 200 }
        job_url: { type: string, nullable: true, description: "http(s) URL" }
        source: { type: string, nullable: true, maxLength: 100 }
        location: { type: string, nullable: true, maxLength: 200 }
        salary_min: { type: integer, format: int32, nullable: true, minimum: 0, maximum: 100000000 }
        salary_max: { type: integer, format: int32, nullable: true, minimum: 0, maximum: 100000000 }
        salary_currency:
          type: string
          nullable: true
          description: ISO 4217 code (case-insensitive); required when a salary is given
        status:
          allOf: [{ $ref: "#/components/schemas/Status" }]
          description: Initial status (default applied)

    TransitionInput:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { $ref: "#/components/schemas/Status" }
        note: { type: string, nullable: true, maxLength: 2000 }
        occurred_at:
          type: string
          format: date-time
          nullable: true
          description: Backdate the change; not in the future, not before the previous event

    Event:
      type: object
      additionalProperties: false
      required: [id, from_status, to_status, note, occurred_at, created_at]
      properties:
        id: { type: integer, format: int64 }
        from_status:
          allOf: [{ $ref: "#/components/schemas/Status" }]
          nullable: true
          description: Null for the event that created the application
        to_status: { $ref: "#/components/schemas/Status" }
        note: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    Contact:
      type: object
      additionalProperties: false
      required: [id, company_id, name, title, email, linkedin_url, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        company_id: { type: integer, format: int64 }
        name: { type: string }
        title: { type: string, nullable: true }
        email: { type: string, nullable: true }
        linkedin_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContactList:
      type: object
      additionalProperties: false
      required: [contacts]
      properties:
        contacts:
          type: array
          items: { $ref: "#/components/schemas/Contact" }

    ContactInput:
      type: object
      additionalProperties: false
      required: [company_id, name]
      properties:
        company_id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, nullable: true, maxLength: 200 }
        email: { type: string, nullable: true, description: A bare address like name@example.com }
        linkedin_url: { type: string, nullable: true, description: A linkedin.com URL }

    Note:
      type: object
      additionalProperties: false
      required: [id, application_id, body, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        application_id: { type: integer, format: int64 }
        body: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NoteInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }

    Board:
      type: string
      description: |
        Job-board type (applicant tracking system). `workday` is unofficial: it reads the JSON
        that the company's public careers page loads, slowly and only during the nightly sync.
      enum: [greenhouse, lever, ashby, smartrecruiters, workday]

    Watch:
      type: object
      additionalProperties: false
      required: [id, company_id, board, board_token, keywords, enabled, last_checked_at, last_error,
                 created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        company_id: { type: integer, format: int64 }
        board: { $ref: "#/components/schemas/Board" }
        board_token:
          type: string
          description: |
            The company's id on the board, e.g. "stripe". For Workday, the careers-site URL in
            canonical form, e.g. "nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite?locationHierarchy1=…"
        keywords:
          type: array
          description: Lower-case; a posting matches if its title contains any. Empty = all postings.
          items: { type: string }
        enabled: { type: boolean }
        last_checked_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WatchInput:
      type: object
      additionalProperties: false
      required: [company_id, board, board_token]
      properties:
        company_id: { type: integer, format: int64, minimum: 1 }
        board: { $ref: "#/components/schemas/Board" }
        board_token:
          type: string
          maxLength: 2000
          description: |
            The company's id on the board (letters, digits, `.` `_` `-`), e.g. "stripe". For
            Workday, paste the careers-site URL; filter it first (e.g. by country) and those
            filters are kept.
        keywords:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 50 }
        enabled: { type: boolean, default: true }
