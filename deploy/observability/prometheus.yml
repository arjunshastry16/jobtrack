# Prometheus's configuration (deploy/observability/compose.yml). Targets are reached by
# name on jobtrack's backend network. Reload after editing:
#   docker compose kill --signal HUP prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # The api's metrics listener (JOBTRACK_METRICS_ADDR); never published on the host.
  - job_name: jobtrack
    static_configs:
      - targets: ["api:9091"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: vertex

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          instance: jobtrack-db

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
