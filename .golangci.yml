version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose      # HTTP response bodies are closed
    - errorlint      # errors compared/wrapped with errors.Is/As and %w
    - gosec          # common security mistakes
    - misspell
    - noctx          # HTTP requests carry a context
    - revive         # style (successor to golint)
    - rowserrcheck   # sql rows.Err() is checked
    - sqlclosecheck  # sql rows/statements are closed
    - unconvert
    - unparam

formatters:
  enable:
    - gofmt
    - goimports
